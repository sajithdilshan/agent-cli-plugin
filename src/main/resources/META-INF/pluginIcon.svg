<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Head gradient: vibrant blue to purple -->
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- Antenna ball glow -->
    <radialGradient id="antennaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </radialGradient>
    <!-- Eye glow -->
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </radialGradient>
    <!-- Ear gradient -->
    <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Antenna stem -->
  <line x1="20" y1="4.5" x2="20" y2="9" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <!-- Antenna ball -->
  <circle cx="20" cy="3" r="2.2" fill="url(#antennaGlow)"/>

  <!-- Ears -->
  <rect x="1" y="16" width="3.5" height="7.5" rx="1.75" fill="url(#earGrad)"/>
  <rect x="35.5" y="16" width="3.5" height="7.5" rx="1.75" fill="url(#earGrad)"/>

  <!-- Head -->
  <rect x="6" y="9" width="28" height="23" rx="5.5" ry="5.5" fill="url(#headGrad)"/>

  <!-- Face plate (subtle inner panel) -->
  <rect x="8.5" y="11.5" width="23" height="18" rx="3.5" ry="3.5" fill="rgba(255,255,255,0.08)"/>

  <!-- Eyes -->
  <rect x="11" y="15.5" width="6" height="6" rx="1.5" fill="#1E1B4B"/>
  <rect x="23" y="15.5" width="6" height="6" rx="1.5" fill="#1E1B4B"/>
  <!-- Eye glow circles -->
  <circle cx="14" cy="18.5" r="2" fill="url(#eyeGlow)"/>
  <circle cx="26" cy="18.5" r="2" fill="url(#eyeGlow)"/>

  <!-- Mouth -->
  <rect x="14.5" y="25.5" width="11" height="2.5" rx="1.25" fill="#1E1B4B"/>
  <!-- Mouth detail lines -->
  <line x1="17.5" y1="25.5" x2="17.5" y2="28" stroke="#2E2960" stroke-width="0.6"/>
  <line x1="20" y1="25.5" x2="20" y2="28" stroke="#2E2960" stroke-width="0.6"/>
  <line x1="22.5" y1="25.5" x2="22.5" y2="28" stroke="#2E2960" stroke-width="0.6"/>
</svg>
