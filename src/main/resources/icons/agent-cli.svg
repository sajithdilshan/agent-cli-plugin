<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" fill="none">
  <!-- Tool window: monochrome wireframe for IDE LaF tinting (#ced0d6). -->
  <g stroke="#ced0d6" fill="none" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antenna -->
    <line x1="6.5" y1="1.2" x2="6.5" y2="2.8"/>
    <circle cx="6.5" cy="0.7" r="0.5"/>
    <!-- Head -->
    <rect x="2.2" y="2.8" width="8.6" height="7" rx="1.6" ry="1.6"/>
    <!-- Eyes -->
    <rect x="3.8" y="4.8" width="1.8" height="1.8" rx="0.4"/>
    <rect x="7.4" y="4.8" width="1.8" height="1.8" rx="0.4"/>
    <!-- Mouth -->
    <line x1="4.8" y1="8.2" x2="8.2" y2="8.2"/>
    <!-- Ears -->
    <rect x="0.5" y="4.8" width="1" height="2.2" rx="0.5"/>
    <rect x="11.5" y="4.8" width="1" height="2.2" rx="0.5"/>
  </g>
</svg>
